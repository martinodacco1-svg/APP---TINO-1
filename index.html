<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APP-TINO V10 AI</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0/dist/mobilenet.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#f3f4f6;padding:12px;padding-bottom:80px}
h1{text-align:center;padding:10px;font-size:20px;background:#111827;color:white;border-radius:12px;margin-bottom:12px}
.card{background:white;border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
input,textarea,select{width:100%;padding:12px;margin-top:8px;border:1px solid #d1d5db;border-radius:10px;font-size:15px}
button{padding:12px;border:none;border-radius:10px;font-weight:800;cursor:pointer}
.btn-blue{background:#2563eb;color:white;width:100%;margin-top:8px}
.btn-dark{background:#111827;color:white;width:100%;margin-top:8px}
.btn-light{background:#e5e7eb;color:#111827;margin-top:8px}
img.thumb{width:80px;height:80px;object-fit:cover;border-radius:8px;margin:4px}
#gallery{display:flex;flex-wrap:wrap}
.badge{display:inline-block;background:#f3f4f6;border:1px solid #e5e7eb;padding:4px 8px;border-radius:99px;font-size:11px;margin-top:6px;font-weight:700}
</style>
</head>
<body>
<h1>APP-TINO - DI TUTTO UN PO'</h1>

<div class="card">
<b>1. FOTO (fai foto al mouse, tastiera, qualsiasi cosa)</b>
<input type="file" id="foto" accept="image/*" capture="environment" multiple onchange="loadPhotos(this)">
<div id="gallery"></div>
<button class="btn-blue" onclick="riconosciAI()">✨ RICONOSCI OGGETTO DALLA FOTO (AI)</button>
<p id="aiStatus" style="font-size:12px;color:#6b7280;margin-top:6px;text-align:center"></p>
</div>

<div class="card">
<b>2. DATI</b>
<input id="scatola" placeholder="Numero Scatola es: 12">
<select id="pos"><option>Scaffale 1</option><option>Scaffale 2</option><option>Scaffale 3</option><option>Vetrina</option><option>Magazzino</option></select>
<input id="titolo" placeholder="Titolo annuncio - verrà generato dall'AI">
<textarea id="desc" rows="6" placeholder="Descrizione - verrà generata dall'AI"></textarea>
<input id="prezzo" placeholder="Prezzo consigliato es: 10€">
<button class="btn-dark" onclick="salva()">💾 SALVA ARTICOLO</button>
</div>

<div id="lista"></div>

<script>
let photosData=[];
let DB=JSON.parse(localStorage.getItem('tino_v10_ai')||'[]');
let model=null;

async function loadModel(){
 document.getElementById('aiStatus').innerText='Carico AI... primo avvio 10 sec';
 model=await mobilenet.load();
 document.getElementById('aiStatus').innerText='AI pronta! Fai foto e clicca Riconosci';
}
loadModel();

function loadPhotos(inp){
 photosData=[];
 document.getElementById('gallery').innerHTML='';
 Array.from(inp.files).forEach(f=>{
  let r=new FileReader();
  r.onload=e=>{
   photosData.push(e.target.result);
   let img=document.createElement('img');img.src=e.target.result;img.className='thumb';
   document.getElementById('gallery').appendChild(img);
  };
  r.readAsDataURL(f);
 });
}

function traduci(label){
 label=label.toLowerCase();
 if(label.includes('mouse')||label.includes('computer mouse')) return {it:'MOUSE PER COMPUTER', prezzo:'8€', desc:'Mouse per computer, funzionante come da foto'};
 if(label.includes('keyboard')) return {it:'TASTIERA COMPUTER', prezzo:'15€', desc:'Tastiera per computer'};
 if(label.includes('monitor')||label.includes('screen')) return {it:'MONITOR COMPUTER', prezzo:'30€', desc:'Monitor / schermo'};
 if(label.includes('cellular')||label.includes('phone')) return {it:'TELEFONO CELLULARE', prezzo:'25€', desc:'Telefono'};
 if(label.includes('cup')||label.includes('mug')) return {it:'TAZZA / BICCHIERE', prezzo:'5€', desc:'Tazza / bicchiere in ceramica/vetro'};
 if(label.includes('plate')) return {it:'PIATTO CERAMICA', prezzo:'6€', desc:'Piatto'};
 if(label.includes('book')) return {it:'LIBRO', prezzo:'5€', desc:'Libro usato'};
 if(label.includes('shoe')) return {it:'SCARPE', prezzo:'12€', desc:'Scarpe usate'};
 return {it: label.toUpperCase(), prezzo:'10€', desc: label};
}

async function riconosciAI(){
 if(photosData.length==0){alert('Fai prima una foto!');return}
 if(!model){alert('AI sta caricando, aspetta 5 sec');return}
 document.getElementById('aiStatus').innerText='Sto analizzando la foto...';
 let img=new Image();img.src=photosData[0];
 img.onload=async ()=>{
  let pred=await model.classify(img);
  let best=pred[0].className;
  let t=traduci(best);
  let titolo=`${t.it} - COME DA FOTO - ${photosData.length} FOTO`;
  let descrizione=`${t.desc}. Oggetto come da foto, nelle ${photosData.length} foto allegate si vede lo stato reale e i dettagli.\n\nVENDO per DI TUTTO UN PO' - Mercatino usato Mediglia\n\nVISITA LA PAGINA DI TUTTO UN PO' PER VEDERE GLI ALTRI ARTICOLI E NON PERDERTI LE NOVITA'\nSPEDIZIONE POSSIBILE`;
  document.getElementById('titolo').value=titolo.toUpperCase();
  document.getElementById('desc').value=descrizione;
  document.getElementById('prezzo').value=t.prezzo;
  document.getElementById('aiStatus').innerText=`Riconosciuto: ${best} → ${t.it}`;
 };
}

function salva(){
 let item={id:Date.now(), photos:photosData, scatola:document.getElementById('scatola').value, pos:document.getElementById('pos').value, titolo:document.getElementById('titolo').value, desc:document.getElementById('desc').value, prezzo:document.getElementById('prezzo').value};
 DB.unshift(item);localStorage.setItem('tino_v10_ai',JSON.stringify(DB));render();alert('Salvato!');
}

function render(){
 let l=document.getElementById('lista');
 l.innerHTML=DB.map(it=>`<div class="card"><div>${it.photos.map(p=>`<img src="${p}" class="thumb">`).join('')}</div><b>${it.titolo}</b><p style="font-size:13px;white-space:pre-wrap">${it.desc}</p><span class="badge">Scatola ${it.scatola}</span><span class="badge">${it.pos}</span><span class="badge">${it.prezzo}</span><br><button class="btn-light" onclick="navigator.clipboard.writeText('${it.titolo}\\n\\n${it.desc}\\nPrezzo: ${it.prezzo}'.replace(/'/g,''));alert('Copiato per Facebook')">📤 Copia per Facebook</button> <button class="btn-light" onclick="DB=DB.filter(x=>x.id!=${it.id});localStorage.setItem('tino_v10_ai',JSON.stringify(DB));render()">🗑️ Cancella</button></div>`).join('');
}
render();
</script>
</body>
</html>
