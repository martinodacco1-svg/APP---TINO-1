<script>
  let currentObj = {
    images: [],
    box: '',
    location: '',
    title: '',
    description: '',
    priceNew: '',
    estimatedMarket: {},
    priceFinal: ''
  };

  // Recupera o imposta la chiave API di OpenAI
  function getOpenAIApiKey() {
    let key = localStorage.getItem('openai_key');
    if (!key) {
      key = prompt("Inserisci la tua chiave API di OpenAI (inizia con sk-...):");
      if (key) {
        localStorage.setItem('openai_key', key.trim());
      }
    }
    return key;
  }

  function openSettings() {
    const currentKey = localStorage.getItem('openai_key') || '';
    const newKey = prompt("Modifica la tua chiave API di OpenAI:", currentKey);
    if (newKey !== null) {
      localStorage.setItem('openai_key', newKey.trim());
      alert("Chiave API salvata con successo!");
    }
  }

  // 1. Avvio: Apre subito la fotocamera
  function startNewObjectFlow() {
    const apiKey = getOpenAIApiKey();
    if (!apiKey) {
      alert("È necessaria una chiave API OpenAI valida per utilizzare l'IA.");
      return;
    }
    currentObj = { images: [], box: '', location: '', title: '', description: '', priceNew: '', estimatedMarket: {}, priceFinal: '' };
    document.getElementById('cameraInput').click();
  }

  // Gestione foto acquisite
  function handleImagesSelected(event) {
    const files = event.target.files;
    if (!files || files.length === 0) return;
    
    let loadedCount = 0;
    for (let file of files) {
      const reader = new FileReader();
      reader.onload = function(e) {
        currentObj.images.push(e.target.result);
        loadedCount++;
        if (loadedCount === files.length) {
          openBoxStep(); // Passa allo step successivo
        }
      }
      reader.readAsDataURL(file);
    }
    event.target.value = '';
  }

  function showWizard(htmlContent) {
    document.getElementById('wizardContent').innerHTML = htmlContent;
    document.getElementById('wizardModal').classList.add('on');
  }

  // STEP 2: SCATOLA
  function openBoxStep() {
    showWizard(`
      <div class="wizard-title">📦 Scatola</div>
      <div class="wizard-step-info">Step 1 di 5 - Dove viene riposto l'oggetto?</div>
      
      <div class="thumbs-preview">
        ${currentObj.images.map(img => `<div class="thumb-item"><img src="${img}"></div>`).join('')}
      </div>

      <label>Numero o Nome Scatola</label>
      <input type="text" id="inputBox" placeholder="Es. Scatola #4 o Armadio Soggiorno" value="${currentObj.box}">
      
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="d" style="flex:1" onclick="closeWizard()">Annulla</button>
        <button class="y" style="flex:1" onclick="saveBoxAndNext()">Avanti</button>
      </div>
    `);
  }

  function saveBoxAndNext() {
    currentObj.box = document.getElementById('inputBox').value;
    openLocationStep();
  }

  // STEP 3: POSIZIONE
  function openLocationStep() {
    showWizard(`
      <div class="wizard-title">📍 Posizione</div>
      <div class="wizard-step-info">Step 2 di 5 - In quale stanza o luogo fisico si trova?</div>
      
      <label>Posizione Specifica</label>
      <input type="text" id="inputLocation" placeholder="Es. Garage, Ripostiglio, Scaffale alto" value="${currentObj.location}">
      
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="d" style="flex:1" onclick="openBoxStep()">Indietro</button>
        <button class="y" style="flex:1" onclick="saveLocationAndNext()">Avanti</button>
      </div>
    `);
  }

  function saveLocationAndNext() {
    currentObj.location = document.getElementById('inputLocation').value;
    openTitleStep();
  }

  // STEP 4: TITOLO CON IA REALE (GPT-4o-mini)
  function openTitleStep() {
    showWizard(`
      <div class="wizard-title">🏷️ Titolo Prodotto</div>
      <div class="wizard-step-info">Step 3 di 5 - Inserisci o genera il titolo con l'IA</div>
      
      <label>Titolo dell'oggetto</label>
      <input type="text" id="inputTitle" placeholder="Es. Trapano Bosch Professionale 18V" value="${currentObj.title}">
      
      <button class="ai-btn" onclick="aiAnalyzeImageForDetails()">✨ Analizza Foto con IA (Titolo & Descrizione)</button>
      
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="d" style="flex:1" onclick="openLocationStep()">Indietro</button>
        <button class="y" style="flex:1" onclick="saveTitleAndNext()">Avanti</button>
      </div>
    `);
  }

  // Funzione che interroga OpenAI Vision usando la prima foto scattata
  async function aiAnalyzeImageForDetails() {
    const apiKey = getOpenAIApiKey();
    if (!apiKey) return alert("Inserisci prima la chiave API!");

    const btn = event.target;
    btn.innerText = "⏳ Analisi foto con OpenAI in corso...";
    btn.disabled = true;

    try {
      const base64Image = currentObj.images[0]; // Prende la prima foto

      const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: "gpt-4o-mini", // Veloce ed economico per immagini
          messages: [
            {
              role: "user",
              content: [
                {
                  type: "text",
                  text: "Sei un esperto di e-commerce e inventario. Analizza questa foto dell'oggetto. Restituisci un JSON rigoroso con esattamente due chiavi: 'title' (un titolo commerciale chiaro e sintetico per un annuncio di vendita) e 'description' (una descrizione dettagliata che include condizioni presunte, marca/modello se visibili e caratteristiche)."
                },
                {
                  type: "image_url",
                  image_url: { url: base64Image }
                }
              ]
            }
          ],
          response_format: { type: "json_object" }
        })
      });

      const data = await response.json();
      if (data.error) {
        throw new Error(data.error.message);
      }

      const result = JSON.parse(data.choices[0].message.content);
      
      // Salva i dati nell'oggetto corrente
      currentObj.title = result.title || "";
      currentObj.description = result.description || "";

      // Aggiorna il campo input se visibile
      const titleInput = document.getElementById('inputTitle');
      if (titleInput) titleInput.value = currentObj.title;

      btn.innerText = "✨ Analisi completata con successo!";
      setTimeout(() => {
        btn.innerText = "✨ Analizza Foto con IA (Titolo & Descrizione)";
        btn.disabled = false;
      }, 2000);

    } catch (error) {
      alert("Errore durante la chiamata a OpenAI: " + error.message);
      btn.innerText = "✨ Analizza Foto con IA (Titolo & Descrizione)";
      btn.disabled = false;
    }
  }

  function saveTitleAndNext() {
    currentObj.title = document.getElementById('inputTitle').value || "Oggetto senza nome";
    openDescriptionStep();
  }

  // STEP 5: DESCRIZIONE
  function openDescriptionStep() {
    showWizard(`
      <div class="wizard-title">📝 Descrizione</div>
      <div class="wizard-step-info">Step 4 di 5 - Dettagli e condizioni dell'oggetto</div>
      
      <label>Descrizione dettagliata (generata o modificabile)</label>
      <textarea id="inputDesc" rows="5">${currentObj.description}</textarea>
      
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="d" style="flex:1" onclick="openTitleStep()">Indietro</button>
        <button class="y" style="flex:1" onclick="saveDescAndNext()">Avanti</button>
      </div>
    `);
  }

  function saveDescAndNext() {
    currentObj.description = document.getElementById('inputDesc').value;
    
    // Stime indicative di prezzo (puoi anche farle stimare da OpenAI se desideri)
    currentObj.priceNew = "120,00";
    currentObj.estimatedMarket = {
      subito: "50,00 € - 70,00 €",
      vinted: "45,00 € - 65,00 €",
      wallapop: "50,00 € - 60,00 €",
      ebay: "60,00 € - 80,00 €",
      marketplace: "55,00 €"
    };
    openPriceStep();
  }

  // STEP 6: PREZZO E STIME DI MERCATO
  function openPriceStep() {
    showWizard(`
      <div class="wizard-title">💶 Prezzo e Valutazione</div>
      <div class="wizard-step-info">Step 5 di 5 - Verifica il mercato e stabilisci il prezzo</div>
      
      <div class="market-estimates">
        <div style="font-weight:700;color:#facc15;margin-bottom:6px">📊 Prezzi di riferimento stimati:</div>
        <div class="market-row"><span>Prezzo da Nuovo:</span> <strong style="color:#22c55e">€ ${currentObj.priceNew}</strong></div>
        <div class="market-row"><span>Subito.it:</span> <span>${currentObj.estimatedMarket.subito}</span></div>
        <div class="market-row"><span>Vinted:</span> <span>${currentObj.estimatedMarket.vinted}</span></div>
        <div class="market-row"><span>Wallapop:</span> <span>${currentObj.estimatedMarket.wallapop}</span></div>
        <div class="market-row"><span>eBay:</span> <span>${currentObj.estimatedMarket.ebay}</span></div>
        <div class="market-row"><span>FB Marketplace:</span> <span>${currentObj.estimatedMarket.marketplace}</span></div>
      </div>

      <label style="margin-top:14px">Il tuo prezzo di vendita (€)</label>
      <input type="number" step="0.01" id="inputFinalPrice" placeholder="Es. 50.00" value="${currentObj.priceFinal}">
      
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="d" style="flex:1" onclick="openDescriptionStep()">Indietro</button>
        <button class="g" style="flex:2" onclick="finishObjectCreation()">Conferma e Salva ✓</button>
      </div>
    `);
  }

  function finishObjectCreation() {
    currentObj.priceFinal = document.getElementById('inputFinalPrice').value;
    closeWizard();
    saveItemToDatabase(currentObj);
  }

  function closeWizard() {
    document.getElementById('wizardModal').classList.remove('on');
  }

  let itemsDB = [];
  function saveItemToDatabase(item) {
    itemsDB.unshift(item);
    renderItems();
  }

  function renderItems() {
    const list = document.getElementById('itemList');
    if (itemsDB.length === 0) {
      list.innerHTML = `<div class="card"><p style="margin:0;color:#9aa3b2;text-align:center;">Nessun oggetto inserito.</p></div>`;
      return;
    }
    
    list.innerHTML = itemsDB.map(i => `
      <div class="card" style="display:flex;gap:12px;align-items:center;">
        <img src="${i.images[0] || 'https://via.placeholder.com/60'}" style="width:60px;height:60px;object-fit:cover;border-radius:10px;">
        <div style="flex:1">
          <div style="font-weight:800;font-size:15-px">${i.title}</div>
          <div style="font-size:12px;color:#9aa3b2;margin-top:2px">Box: ${i.box || '-'} | Pos: ${i.location || '-'}</div>
          <div style="font-weight:700;color:#22c55e;margin-top:4px">€ ${i.priceFinal || '0.00'}</div>
        </div>
      </div>
    `).join('');
  }
</script>
